<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nedtælling til Fredag</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');

        body {
            margin: 0;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 3rem;
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            opacity: 0.7;
            /* Animation til teksten */
            animation: floatText 4s ease-in-out infinite;
        }

        .bubble-card {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 3rem 4rem;
            border-radius: 80px;
            display: flex;
            gap: 3rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            /* Boble-animation */
            animation: float 6s ease-in-out infinite;
        }

        .bubble-card::before {
            content: "";
            position: absolute;
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.4), transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(56, 189, 248, 0.4), transparent 60%);
            filter: blur(60px);
            z-index: -1;
            border-radius: 100px;
        }

        .unit { text-align: center; }
        
        .number {
            font-size: 4rem;
            font-weight: 600;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        /* Animationer */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(1deg); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(-10px); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="title">Nedtælling til fredag</div>

    <div class="bubble-card">
        <div class="unit"><div id="days" class="number">00</div><div class="label">Dage</div></div>
        <div class="unit"><div id="hours" class="number">00</div><div class="label">Timer</div></div>
        <div class="unit"><div id="minutes" class="number">00</div><div class="label">Min</div></div>
        <div class="unit"><div id="seconds" class="number">00</div><div class="label">Sek</div></div>
    </div>

    <script>
        function updateTimer() {
            const now = new Date();
            let friday = new Date();
            friday.setDate(now.getDate() + (5 + 7 - now.getDay()) % 7);
            friday.setHours(0, 0, 0, 0);

            if (now.getDay() === 5 && now.getHours() >= 0) {
                 friday.setDate(friday.getDate() + 7);
            }

            const diff = friday - now;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
