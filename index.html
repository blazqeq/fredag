<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savannah Sophia Sonne | Live Dashboard</title>
    <style>
        :root { --twitch-purple: #9146FF; --bg-dark: #0e0e10; --card-bg: #18181b; }
        body { margin: 0; background-color: var(--bg-dark); color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        .header { padding: 40px 20px; text-align: center; }
        h1 { margin: 0; color: var(--twitch-purple); font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }

        .container { width: 95%; max-width: 1000px; }

        /* Twitch Live Embed */
        #twitch-live { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

        /* Clips Grid */
        .clips-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 40px; margin-bottom: 60px; }
        .clip-box { border-radius: 8px; overflow: hidden; background: var(--card-bg); border: 1px solid #333; }
        .clip-box iframe { width: 100%; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Savannah Sophia Sonne</h1>
    </div>

    <div class="container">
        <!-- Live Player -->
        <div id="twitch-live"></div>

        <!-- Clips -->
        <div class="clips-container">
            <div class="clip-box"><iframe src="https://clips.twitch.tv/embed?clip=EmpathicMotionlessBasenjiFrankerZ-oP8IuqXbJGhEwQTN&parent=www.example.com" frameborder="0" allowfullscreen="true" scrolling="no" height="378" width="100%"></iframe></div>
            <div class="clip-box"><iframe src="https://clips.twitch.tv/embed?clip=TrappedThirstyCookieSMOrc-rC9apntsTKINQkyw&parent=www.example.com" frameborder="0" allowfullscreen="true" scrolling="no" height="378" width="100%"></iframe></div>
            <div class="clip-box"><iframe src="https://clips.twitch.tv/embed?clip=CheerfulCrackyHamburgerBCouch-6_WU5Bu6KB2V4m91&parent=www.example.com" frameborder="0" allowfullscreen="true" scrolling="no" height="378" width="100%"></iframe></div>
        </div>
    </div>

    <!-- Twitch Script -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script type="text/javascript">
      new Twitch.Embed("twitch-live", {
        width: "100%",
        height: "100%",
        channel: "savannahsophiasonne",
        layout: "video",
        autoplay: true,
        muted: false
      });
    </script>
</body>
</html>
