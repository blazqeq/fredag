<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ned til fredag</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            color: #94a3b8;
        }

        #timer {
            display: flex;
            gap: 2rem;
        }

        .unit {
            display: flex;
            flex-direction: column;
        }

        .number {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEDTÆLLING TIL FREDAG</h1>
        <div id="timer">
            <div class="unit"><span id="days" class="number">00</span><span class="label">Dage</span></div>
            <div class="unit"><span id="hours" class="number">00</span><span class="label">Timer</span></div>
            <div class="unit"><span id="minutes" class="number">00</span><span class="label">Min</span></div>
            <div class="unit"><span id="seconds" class="number">00</span><span class="label">Sek</span></div>
        </div>
    </div>

    <script>
        function updateTimer() {
            const now = new Date();
            // Find kommende fredag (dag 5)
            let friday = new Date();
            friday.setDate(now.getDate() + (5 + 7 - now.getDay()) % 7);
            friday.setHours(0, 0, 0, 0);

            const diff = friday - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
